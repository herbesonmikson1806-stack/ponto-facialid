<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polaroid — gere sua foto instantânea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #d8e0e3;        /* mesa de luz, cinza-azulado */
  --surface: #edf1f2;
  --ink: #1c2733;
  --muted: #56666f;
  --line: #b9c5ca;
  --accent: #1f5fd1;    /* cobalto */
  --accent-ink: #ffffff;
  --paper: #fbfaf6;     /* branco da Polaroid */
  --danger: #b3261e;
  --ok: #1e7a4a;
  --radius-sm: 6px;
  --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Caveat", "Segoe Print", cursive;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
}
img { max-width: 100%; display: block; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Topo */
.topbar {
  display: flex; justify-content: space-between; align-items: baseline;
  max-width: 1180px; margin: 0 auto; padding: 22px 24px 0;
}
.brand {
  font-family: var(--hand); font-weight: 700; font-size: 2rem;
  color: var(--ink); text-decoration: none; line-height: 1;
}
.toplink { color: var(--ink); font-weight: 600; text-underline-offset: 4px; }

/* Layout principal */
.studio {
  max-width: 1180px; margin: 0 auto; padding: 24px;
  display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 48px;
  align-items: start;
}

.panel { display: flex; flex-direction: column; gap: 18px; }
.title {
  font-size: clamp(2rem, 3.6vw, 2.75rem); line-height: 1.05; font-weight: 800;
  letter-spacing: -0.02em; margin: 0;
}
.lede { margin: -6px 0 4px; color: var(--muted); max-width: 36ch; }

/* Área de upload */
.drop {
  position: relative; display: grid; place-items: center; text-align: center;
  min-height: 150px; padding: 16px;
  border: 2px dashed var(--line); border-radius: var(--radius-sm);
  background: var(--surface); cursor: pointer; overflow: hidden;
  transition: border-color .15s, background .15s;
}
.drop:hover, .drop.is-over { border-color: var(--accent); background: #e6edf7; }
.drop:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop-text { display: grid; gap: 2px; pointer-events: none; }
.drop-text strong { font-size: 1.05rem; }
.drop-text span { font-size: .875rem; color: var(--muted); }
.drop img { width: 84px; height: 84px; object-fit: cover; border-radius: 4px; margin-bottom: 8px; }
.drop.has-file { grid-template-columns: auto 1fr; justify-items: start; gap: 16px; text-align: left; min-height: 0; }
.drop.has-file img { margin: 0; }

/* Campos */
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: .9375rem; display: flex; justify-content: space-between; }
.count { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.field input {
  font: inherit; color: var(--ink);
  padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: #fff;
}
.field input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(31,95,209,.2); }
.field input[aria-invalid="true"] { border-color: var(--danger); }

.error { margin: 0; color: var(--danger); font-weight: 600; }

/* Botões */
.btn {
  font: inherit; font-weight: 600; font-size: .9375rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 18px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
  cursor: pointer; text-decoration: none;
}
.btn:hover { background: var(--ink); color: var(--surface); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: 14px 18px; font-size: 1rem; }
.btn-primary:hover { background: #174aa6; border-color: #174aa6; color: #fff; }

/* Palco da pré-visualização */
.stage { display: grid; justify-items: center; gap: 22px; padding-top: 12px; }
.print {
  position: relative; width: min(100%, 440px);
  transform: rotate(-2deg);
  filter: drop-shadow(0 18px 24px rgba(28, 39, 51, .22)) drop-shadow(0 2px 3px rgba(28, 39, 51, .18));
}
.tape {
  position: absolute; top: -14px; left: 50%; z-index: 2;
  width: 120px; height: 32px; transform: translateX(-50%) rotate(3deg);
  background: rgba(240, 236, 214, .75);
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.print-empty {
  aspect-ratio: 88 / 107; background: var(--paper);
  padding: 5.5% 5.5% 0; display: flex; flex-direction: column;
}
.empty-photo { aspect-ratio: 1; background: repeating-linear-gradient(135deg, #e4e7e6 0 10px, #dde1e0 10px 20px); }
.print-empty p {
  flex: 1; display: grid; place-items: center; margin: 0;
  font-family: var(--hand); font-size: 1.75rem; color: #8a9398;
}
#preview { width: 100%; }

/* Efeito de revelação — o único movimento automático da página */
.developing { animation: develop 2.6s ease-out both; }
@keyframes develop {
  0%   { filter: sepia(1) brightness(1.35) contrast(.35) saturate(.2); }
  60%  { filter: sepia(.35) brightness(1.08) contrast(.85) saturate(.8); }
  100% { filter: none; }
}
@media (prefers-reduced-motion: reduce) {
  .developing { animation: none; }
}

.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.status { min-height: 1.5em; margin: 0; text-align: center; color: var(--muted); max-width: 52ch; }
.status.ok { color: var(--ok); }
.status.err { color: var(--danger); }
.status a { color: inherit; }

@media (max-width: 860px) {
  .studio { grid-template-columns: 1fr; gap: 36px; padding: 18px; }
  .stage { order: 2; }
  .print { width: min(100%, 380px); }
}

/* ===== Painel administrativo ===== */
.admin { max-width: 1180px; margin: 0 auto; padding: 24px; }
.admin-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; margin-bottom: 28px; }
.admin-head h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.admin-head p { margin: 4px 0 0; color: var(--muted); }
.admin-tools { display: flex; gap: 10px; flex-wrap: wrap; }
.admin-tools input {
  font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  min-width: 240px; background: #fff; color: var(--ink);
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 32px 24px; }
.item { display: grid; gap: 10px; align-content: start; }
.item .shot { display: block; filter: drop-shadow(0 8px 12px rgba(28,39,51,.2)); }
.item:nth-child(3n+1) .shot { transform: rotate(-1.5deg); }
.item:nth-child(3n+2) .shot { transform: rotate(1deg); }
.item dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: .875rem; }
.item dt { color: var(--muted); }
.item dd { margin: 0; overflow-wrap: anywhere; }
.item dd a { color: var(--accent); }
.item dl { margin-top: 6px; }
.item .row { display: flex; gap: 8px; flex-wrap: wrap; }
.item .btn { padding: 6px 12px; font-size: .8125rem; }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.empty-state { padding: 48px 0; color: var(--muted); font-size: 1.125rem; }

/* ===== Versão web (arquivo único) ===== */
.nav { display: flex; gap: 20px; align-items: baseline; }
.nav a[aria-current="page"] { text-decoration-thickness: 2px; }
.mode {
  max-width: 1180px; margin: 10px auto 0; padding: 0 24px;
  font-size: .875rem; color: var(--muted);
}
.mode strong { color: var(--ink); }
.login { max-width: 360px; display: grid; gap: 16px; padding: 24px 0; }
.login h2 { margin: 0; font-size: 1.5rem; }
.login p { margin: 0; color: var(--muted); }
/* Arte própria na borda */
.art-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.art-pick {
  position: relative; display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 14px 8px 8px; min-height: 48px; max-width: 100%;
  border: 1.5px dashed var(--line); border-radius: var(--radius-sm); background: #fff; cursor: pointer;
  font-weight: 600; font-size: .9375rem;
}
.art-pick:hover { border-color: var(--accent); }
.art-pick:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.art-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.art-pick img { width: 56px; height: 32px; object-fit: contain; background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0 / 10px 10px; border-radius: 3px; }
.art-pick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 22ch; }
.seg { justify-self: start; display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: #fff; }
.seg label { position: relative; padding: 8px 14px; font-size: .875rem; font-weight: 600; cursor: pointer; border-right: 1px solid var(--line); }
.seg label:last-child { border-right: 0; }
.seg input { position: absolute; opacity: 0; }
.seg label:has(input:checked) { background: var(--ink); color: var(--surface); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: -3px; }
.hint { margin: 0; font-size: .8125rem; color: var(--muted); }

/* Seleção para PDF */
.pick { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: .9375rem; cursor: pointer; width: fit-content; }
.pick input { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
.pick .order { color: var(--accent); font-variant-numeric: tabular-nums; }
.item.is-picked .shot { outline: 4px solid var(--accent); outline-offset: 6px; }
.pdfbar {
  position: sticky; bottom: 0; z-index: 5; margin: 32px -24px 0; padding: 14px 24px;
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  background: var(--ink); color: var(--surface);
}
.pdfbar p { margin: 0; }
.pdfbar p a { color: #fff; font-weight: 600; }
.pdfbar .btns { display: flex; gap: 10px; flex-wrap: wrap; }
.pdfbar .btn { border-color: var(--surface); color: var(--surface); }
.pdfbar .btn:hover { background: var(--surface); color: var(--ink); }
.pdfbar .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.pdfbar .btn-primary:hover { background: #174aa6; border-color: #174aa6; color: #fff; }
.link-btn { font: inherit; background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; font-weight: 600; }
</style>
</head>
<body>
<!--
  =====================================================================
  POLAROID — versão web em arquivo único
  ---------------------------------------------------------------------
  Funciona em dois modos:
   • MODO LOCAL (padrão, sem configurar nada): as Polaroids ficam salvas
     no próprio navegador (IndexedDB). A galeria mostra só o que foi feito
     naquele aparelho. E-mail abre o app de e-mail do usuário.
   • MODO NUVEM: preencha SUPABASE_URL e SUPABASE_ANON_KEY abaixo.
     Tudo vai para o banco do Supabase e a galeria (com login) mostra
     todas as fotos de todos os usuários. Preenchendo também o EmailJS,
     o e-mail é enviado automaticamente pelo botão.
  Passo a passo completo no arquivo LEIA-ME.md.
  =====================================================================
-->
<header class="topbar">
  <a class="brand" href="#">Polaroid</a>
  <nav class="nav">
    <a class="toplink" href="#" id="navStudio">Gerar</a>
    <a class="toplink" href="#galeria" id="navGallery">Galeria</a>
  </nav>
</header>
<p class="mode" id="modeInfo"></p>

<!-- ============ TELA DE GERAÇÃO ============ -->
<main class="studio" id="viewStudio">
  <form id="form" class="panel" novalidate>
    <h1 class="title">Transforme uma foto em Polaroid</h1>
    <p class="lede">Envie a imagem, escreva a legenda e receba por e-mail ou WhatsApp.</p>

    <label class="drop" id="drop">
      <input id="file" type="file" accept="image/jpeg,image/png" required>
      <img id="thumb" alt="" hidden>
      <span class="drop-text" id="dropText">
        <strong>Escolha uma foto</strong>
        <span>ou arraste aqui · JPG ou PNG, de qualquer tamanho até 80 MB</span>
      </span>
    </label>

    <div class="field">
      <label for="caption">Legenda <span class="count" id="count">0/40</span></label>
      <input id="caption" type="text" maxlength="40" placeholder="Praia de Iracema, 2026" autocomplete="off">
    </div>

    <div class="field">
      <label for="art">Arte na borda <span class="count">opcional · PNG ou JPG</span></label>
      <div class="art-row">
        <label class="art-pick">
          <input id="art" type="file" accept="image/png,image/jpeg">
          <img id="artThumb" alt="" hidden>
          <span id="artName">Escolher arte</span>
        </label>
        <button type="button" class="link-btn" id="artRemove" hidden>Remover</button>
      </div>
      <div class="seg" id="artPos" role="radiogroup" aria-label="Posição da arte" hidden>
        <label><input type="radio" name="artPos" value="right" checked>Direita</label>
        <label><input type="radio" name="artPos" value="left">Esquerda</label>
        <label><input type="radio" name="artPos" value="full">Borda inteira</label>
      </div>
      <p class="hint" id="artHint" hidden></p>
    </div>
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="voce@email.com" autocomplete="email" inputmode="email">
    </div>
    <div class="field">
      <label for="whatsapp">WhatsApp</label>
      <input id="whatsapp" type="tel" placeholder="(85) 99999-9999" autocomplete="tel-national" inputmode="numeric" maxlength="15">
    </div>

    <p class="error" id="error" role="alert" hidden></p>
    <button class="btn btn-primary" id="generate" type="submit">Gerar Polaroid</button>
  </form>

  <section class="stage" aria-live="polite">
    <div class="print">
      <span class="tape" aria-hidden="true"></span>
      <div class="print-empty" id="empty">
        <div class="empty-photo"></div>
        <p>Sua Polaroid aparece aqui</p>
      </div>
      <img id="preview" alt="Pré-visualização da Polaroid" hidden>
    </div>
    <div class="actions" id="actions" hidden>
      <a class="btn" id="download" download="polaroid.jpg">Baixar</a>
      <button class="btn" id="sendEmail" type="button">Enviar por e-mail</button>
      <button class="btn" id="sendWhats" type="button">Enviar por WhatsApp</button>
      <button class="btn" id="share" type="button" hidden>Compartilhar imagem</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>
</main>

<!-- ============ GALERIA / PAINEL ============ -->
<main class="admin" id="viewGallery" hidden>
  <form class="login" id="login" hidden>
    <h2>Entrar na galeria</h2>
    <p>Use o usuário administrador criado no Supabase.</p>
    <div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="loginPass">Senha</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
    <p class="error" id="loginError" role="alert" hidden></p>
    <button class="btn btn-primary" type="submit">Entrar</button>
  </form>

  <div id="galleryBody" hidden>
    <div class="admin-head">
      <div>
        <h1>Galeria</h1>
        <p id="total">Carregando…</p>
      </div>
      <div class="admin-tools">
        <input id="q" type="search" placeholder="Buscar por legenda, e-mail ou WhatsApp" aria-label="Buscar">
        <button class="btn" id="csv" type="button">Exportar CSV</button>
        <button class="btn" id="logout" type="button" hidden>Sair</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>

    <div class="pdfbar" id="pdfbar" hidden>
      <p id="pdfInfo">0 de 6 selecionadas</p>
      <div class="btns">
        <button class="btn" id="pdfClear" type="button">Limpar seleção</button>
        <button class="btn btn-primary" id="pdfMake" type="button">Gerar PDF</button>
      </div>
    </div>
  </div>
</main>

<canvas id="canvas" hidden></canvas>

<script>
/* =====================================================================
   CONFIGURAÇÃO — preencha para ativar o modo nuvem (veja LEIA-ME.md)
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: '',          // ex.: 'https://abcdxyz.supabase.co'
  SUPABASE_ANON_KEY: '',     // chave "anon public" (pode ficar no front-end)
  BUCKET: 'polaroids',

  EMAILJS_PUBLIC_KEY: '',    // opcional: envio automático de e-mail
  EMAILJS_SERVICE_ID: '',
  EMAILJS_TEMPLATE_ID: '',

  DDI: '55',                 // código do país para o WhatsApp
};
/* ===================================================================== */

(function () {
  'use strict';
  const CLOUD = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
  const AUTO_MAIL = CLOUD && !!(CONFIG.EMAILJS_PUBLIC_KEY && CONFIG.EMAILJS_SERVICE_ID && CONFIG.EMAILJS_TEMPLATE_ID);
  const MAX_BYTES = 80 * 1024 * 1024;      // limite de segurança para o navegador não travar
  const OPTIMIZE_ABOVE = 8 * 1024 * 1024;  // fotos acima disso são otimizadas antes de salvar
  const MAX_SIDE = 4096;                   // maior lado da cópia otimizada (px)
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const onlyDigits = (v) => String(v || '').replace(/\D/g, '');
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

  function maskPhone(v) {
    const d = onlyDigits(v).slice(0, 11);
    if (!d) return '';
    if (d.length <= 2) return `(${d}`;
    if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
    if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
    return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  }
  const fmtDate = (s) => (s ? new Date(s).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—');

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve;
      s.onerror = () => reject(new Error('Não foi possível carregar ' + src));
      document.head.appendChild(s);
    });
  }

  /* ================== RENDERIZAÇÃO DA POLAROID (Canvas) ================== */
  const W = 1080, H = Math.round(W * 107 / 88), SIDE = Math.round(W * 0.052), PHOTO = W - SIDE * 2;

  async function loadImage(file) {
    if ('createImageBitmap' in window) {
      try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (_) {}
    }
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Não foi possível ler a imagem.')); };
      img.src = url;
    });
  }

  function fitCaption(ctx, text, maxWidth) {
    for (let size = 88; size >= 44; size -= 4) {
      ctx.font = `700 ${size}px Caveat, "Segoe Print", cursive`;
      if (ctx.measureText(text).width <= maxWidth) return { size, lines: [text] };
      const lines = [''];
      for (const w of text.split(/\s+/)) {
        const test = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + w : w;
        if (ctx.measureText(test).width <= maxWidth) lines[lines.length - 1] = test; else lines.push(w);
      }
      if (lines.length <= 2 && lines.every((l) => ctx.measureText(l).width <= maxWidth)) return { size, lines };
    }
    ctx.font = '700 44px Caveat, cursive';
    return { size: 44, lines: [text] };
  }

  /* Fotos grandes: cria uma cópia JPEG de até 4096 px no maior lado.
     Mantém qualidade de sobra para a Polaroid e para impressão, e fica
     bem abaixo do limite de 12 MB do armazenamento. */
  async function optimizeOriginal(file) {
    const img = await loadImage(file);
    const big = Math.max(img.width, img.height);
    if (file.size <= OPTIMIZE_ABOVE && big <= MAX_SIDE) { if (img.close) img.close(); return file; }

    let side = Math.min(MAX_SIDE, big), quality = 0.9, out = null;
    for (let attempt = 0; attempt < 4; attempt++) {
      const scale = side / big;
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const cx = c.getContext('2d');
      cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);   // fundo branco para PNG transparente
      cx.imageSmoothingQuality = 'high';
      cx.drawImage(img, 0, 0, c.width, c.height);
      out = await toBlob(c, 'image/jpeg', quality);
      if (out.size <= 11 * 1024 * 1024) break;
      side = Math.round(side * 0.8); quality -= 0.05;
    }
    if (img.close) img.close();
    const name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
    return new File([out], name, { type: 'image/jpeg' });
  }

  async function renderPolaroid(canvas, file, caption, art, artPos) {
    const img = await loadImage(file);
    try { await document.fonts.load('700 64px Caveat'); } catch (_) {}
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    // papel com textura sutil
    ctx.fillStyle = '#fbfaf6'; ctx.fillRect(0, 0, W, H);
    const grain = ctx.createImageData(W, H);
    for (let i = 3; i < grain.data.length; i += 4) grain.data[i] = Math.random() * 8;
    const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
    tmp.getContext('2d').putImageData(grain, 0, 0);
    ctx.drawImage(tmp, 0, 0);

    // foto quadrada recortada ao centro
    const side = Math.min(img.width, img.height);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, SIDE, SIDE, PHOTO, PHOTO);

    // sombra interna e contorno leve
    const g = ctx.createLinearGradient(0, SIDE, 0, SIDE + 28);
    g.addColorStop(0, 'rgba(0,0,0,0.18)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(SIDE, SIDE, PHOTO, 28);
    ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 2;
    ctx.strokeRect(SIDE + 1, SIDE + 1, PHOTO - 2, PHOTO - 2);

    // borda inferior: arte própria e/ou legenda
    const top = SIDE + PHOTO, bh = H - top;          // área da borda: 968 x ~289 px
    let text = (caption || '').trim();
    let textX = SIDE, textW = PHOTO;                 // faixa horizontal disponível para a legenda

    if (art) {
      const artImg = await loadImage(art);
      const pad = 22;
      // caixa onde a arte cabe (mantendo a proporção dela)
      let boxW, boxH = bh - pad * 2;
      if (artPos === 'full' || !text) boxW = PHOTO - pad * 2;
      else boxW = Math.round(PHOTO * 0.4);
      const k = Math.min(boxW / artImg.width, boxH / artImg.height);
      const aw = artImg.width * k, ah = artImg.height * k;
      const ay = top + (bh - ah) / 2;
      let ax;
      if (artPos === 'full' || !text) ax = SIDE + (PHOTO - aw) / 2;
      else if (artPos === 'left') ax = SIDE + pad;
      else ax = SIDE + PHOTO - pad - aw;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(artImg, ax, ay, aw, ah);
      if (artImg.close) artImg.close();

      if (artPos === 'full') text = '';               // borda inteira: a arte ocupa o lugar da legenda
      else if (text) {
        textW = PHOTO - aw - pad * 3;
        textX = artPos === 'left' ? SIDE + pad * 2 + aw : SIDE + pad;
      }
    }

    if (text) {
      const { size, lines } = fitCaption(ctx, text, textW - 20);
      ctx.fillStyle = '#2a2f3a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const lh = size * 1.05, y0 = top + bh / 2 - ((lines.length - 1) * lh) / 2;
      lines.forEach((l, i) => ctx.fillText(l, textX + textW / 2, y0 + i * lh));
    }
    if (img.close) img.close();
  }

  const toBlob = (canvas, type, q) => new Promise((res, rej) =>
    canvas.toBlob((b) => (b ? res(b) : rej(new Error('Falha ao gerar a imagem.'))), type, q));

  /* ================== ARMAZENAMENTO LOCAL (IndexedDB) ================== */
  const LocalStore = {
    _db: null,
    open() {
      if (this._db) return this._db;
      this._db = new Promise((resolve, reject) => {
        const r = indexedDB.open('polaroid-app', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('polaroids', { keyPath: 'uid' });
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
      return this._db;
    },
    async run(mode, fn) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const t = db.transaction('polaroids', mode);
        const req = fn(t.objectStore('polaroids'));
        t.oncomplete = () => resolve(req && req.result);
        t.onerror = () => reject(t.error);
      });
    },
    async save({ uid, caption, email, whatsapp, original, polaroid }) {
      const rec = { uid, caption, email, whatsapp, original, polaroid, createdAt: new Date().toISOString(), emailSentAt: null, whatsappOpenedAt: null };
      await this.run('readwrite', (s) => s.put(rec));
      return { uid, polaroidUrl: null };
    },
    _urls: [],
    async list() {
      this._urls.forEach(URL.revokeObjectURL); this._urls = [];
      const rows = (await this.run('readonly', (s) => s.getAll())) || [];
      return rows.sort((a, b) => b.createdAt.localeCompare(a.createdAt)).map((r) => {
        const polaroidUrl = URL.createObjectURL(r.polaroid), originalUrl = URL.createObjectURL(r.original);
        this._urls.push(polaroidUrl, originalUrl);
        return { ...r, polaroidUrl, originalUrl, original: undefined, polaroid: undefined };
      });
    },
    async remove(uid) { await this.run('readwrite', (s) => s.delete(uid)); },
    async mark(uid, kind) {
      const rec = await this.run('readonly', (s) => s.get(uid));
      if (!rec) return;
      rec[kind === 'email' ? 'emailSentAt' : 'whatsappOpenedAt'] = new Date().toISOString();
      await this.run('readwrite', (s) => s.put(rec));
    },
  };

  /* ================== ARMAZENAMENTO NA NUVEM (Supabase) ================== */
  const CloudStore = {
    _sb: null,
    async client() {
      if (this._sb) return this._sb;
      if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js');
      this._sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      return this._sb;
    },
    async save({ uid, caption, email, whatsapp, original, polaroid }) {
      const sb = await this.client();
      const bucket = sb.storage.from(CONFIG.BUCKET);
      const ext = original.type === 'image/png' ? 'png' : 'jpg';
      const originalPath = `original/${uid}.${ext}`;
      const polaroidPath = `polaroid/${uid}.jpg`;

      let r = await bucket.upload(originalPath, original, { contentType: original.type, upsert: false });
      if (r.error) throw new Error('Falha ao enviar a foto: ' + r.error.message);
      r = await bucket.upload(polaroidPath, polaroid, { contentType: 'image/jpeg', upsert: false });
      if (r.error) throw new Error('Falha ao enviar a Polaroid: ' + r.error.message);

      const polaroidUrl = bucket.getPublicUrl(polaroidPath).data.publicUrl;
      const originalUrl = bucket.getPublicUrl(originalPath).data.publicUrl;
      const ins = await sb.from('polaroids').insert({
        uid, caption: caption || null, email: email || null, whatsapp: whatsapp || null,
        original_path: originalPath, polaroid_path: polaroidPath,
        original_url: originalUrl, polaroid_url: polaroidUrl,
      });
      if (ins.error) throw new Error('Falha ao salvar no banco: ' + ins.error.message);
      return { uid, polaroidUrl };
    },
    async list() {
      const sb = await this.client();
      const { data, error } = await sb.from('polaroids').select('*').order('created_at', { ascending: false });
      if (error) throw new Error(error.message);
      return data.map((r) => ({
        uid: r.uid, caption: r.caption, email: r.email, whatsapp: r.whatsapp,
        createdAt: r.created_at, emailSentAt: r.email_sent_at, whatsappOpenedAt: r.whatsapp_opened_at,
        polaroidUrl: r.polaroid_url, originalUrl: r.original_url,
        _paths: [r.original_path, r.polaroid_path],
      }));
    },
    async remove(uid, paths) {
      const sb = await this.client();
      const { error } = await sb.from('polaroids').delete().eq('uid', uid);
      if (error) throw new Error(error.message);
      if (paths) await sb.storage.from(CONFIG.BUCKET).remove(paths);
    },
    async mark(uid, kind) {
      const sb = await this.client();
      await sb.rpc('mark_event', { p_uid: uid, p_kind: kind });
    },
  };

  function showArt(blob, name) {

  // restaura a arte usada da última vez
  (async () => {

  function handleFile(file) {
    if (!file) return;
    if (!['image/jpeg', 'image/png'].includes(file.type)) { fileInput.value = ''; return showError('Formato não suportado. Escolha uma imagem JPG ou PNG.', fileInput); }
    if (file.size > MAX_BYTES) { fileInput.value = ''; return showError('A imagem passa de 80 MB. Escolha uma foto menor.', fileInput); }
    showError('');

  form.addEventListener('submit', async (e) => {

    if (mail && !EMAIL_RE.test(mail)) return showError('Confira o e-mail: ele precisa ter o formato nome@dominio.com.', email);
    if (phone && (phone.length < 10 || phone.length > 11)) return showError('Confira o WhatsApp: informe DDD + número, ex.: (85) 99999-9999.', whatsapp);

  $('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('loginError'); err.hidden = true;
    const sb = await CloudStore.client();
    const { error } = await sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPass').value });
    if (error) { err.textContent = 'E-mail ou senha incorretos.'; err.hidden = false; return; }
    $('loginPass').value = '';
    openGallery();
  });
  $('logout').addEventListener('click', async () => { const sb = await CloudStore.client(); await sb.auth.signOut(); openGallery(); });

  q.addEventListener('input', renderGrid);

  grid.addEventListener('click', async (e) => {
    const uid = e.target.dataset.del; if (!uid) return;
    if (!confirm('Excluir esta Polaroid e os arquivos dela? Não dá para desfazer.')) return;
    const row = rows.find((r) => r.uid === uid);
    try { await Store.remove(uid, row && row._paths); loadGallery(); }
    catch (err) { alert('Não foi possível excluir: ' + err.message); }
  });

  /* ================== SELEÇÃO + PDF (6 por folha A4) ================== */
  const pdfbar = $('pdfbar'), pdfInfo = $('pdfInfo'), pdfMake = $('pdfMake');
  let pdfUrl = null;

  function updatePdfBar(msg) {
    pdfbar.hidden = picked.length === 0 && !msg;
    pdfInfo.innerHTML = msg || (picked.length === PDF_MAX
      ? `${PDF_MAX} de ${PDF_MAX} selecionadas. A folha está completa.`
      : `${picked.length} de ${PDF_MAX} selecionadas`);
    pdfMake.disabled = picked.length === 0;
  }

  grid.addEventListener('change', (e) => {
    const uid = e.target.dataset.pick; if (!uid) return;
    if (e.target.checked) {
      if (picked.length >= PDF_MAX) {
        e.target.checked = false;
        return updatePdfBar(`A folha já tem ${PDF_MAX} fotos. Desmarque uma para trocar.`);
      }
      picked.push(uid);
    } else {
      picked = picked.filter((u) => u !== uid);
    }
    renderGrid(); updatePdfBar();
  });

  $('pdfClear').addEventListener('click', () => { picked = []; renderGrid(); updatePdfBar(); });

  async function imageToDataUrl(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error('não foi possível baixar uma das imagens');
    const blob = await r.blob();
    return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
  }

  pdfMake.addEventListener('click', async () => {
    if (!picked.length) return;
    busy(pdfMake, true, 'Gerando PDF…');
    try {
      if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
      doc.setProperties({ title: 'Polaroids' });

      // Grade 2 x 3 numa folha A4 (210 x 297 mm), mantendo a proporção 88:107 da Polaroid
      const COLS = 2, CARD_H = 90, CARD_W = CARD_H * 88 / 107;   // ≈ 74 x 90 mm
      const GAP_X = 12, GAP_Y = 6;
      const x0 = (210 - (COLS * CARD_W + GAP_X)) / 2;
      const y0 = (297 - (3 * CARD_H + 2 * GAP_Y)) / 2;

      for (let i = 0; i < picked.length; i++) {
        const row = rows.find((r) => r.uid === picked[i]);
        if (!row) continue;
        const data = await imageToDataUrl(row.polaroidUrl);
        const fmt = data.startsWith('data:image/png') ? 'PNG' : 'JPEG';
        const x = x0 + (i % COLS) * (CARD_W + GAP_X);
        const y = y0 + Math.floor(i / COLS) * (CARD_H + GAP_Y);
        doc.addImage(data, fmt, x, y, CARD_W, CARD_H);
        // linha de corte tracejada (a borda branca some no papel branco)
        doc.setDrawColor(170); doc.setLineWidth(0.2); doc.setLineDashPattern([1.5, 1.5], 0);
        doc.rect(x, y, CARD_W, CARD_H);
      }

      const blob = doc.output('blob');
      if (pdfUrl) URL.revokeObjectURL(pdfUrl);
      pdfUrl = URL.createObjectURL(blob);
      doc.save(`polaroids-${new Date().toISOString().slice(0, 10)}.pdf`);
      updatePdfBar(`PDF baixado. <a href="${pdfUrl}" target="_blank" rel="noopener">Abrir para imprimir</a>. Na impressão, escolha tamanho real (100%).`);
    } catch (err) {
      updatePdfBar('Não foi possível gerar o PDF: ' + esc(err.message));
    } finally {
      busy(pdfMake, false);
    }
  });

  $('csv').addEventListener('click', () => {
    const c = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const head = ['legenda', 'email', 'whatsapp', 'criada_em', 'email_enviado_em', 'whatsapp_aberto_em', 'link_polaroid'];
    const lines = filtered().map((r) => [r.caption, r.email, r.whatsapp, fmtDate(r.createdAt), r.emailSentAt ? fmtDate(r.emailSentAt) : '', r.whatsappOpenedAt ? fmtDate(r.whatsappOpenedAt) : '', CLOUD ? r.polaroidUrl : ''].map(c).join(';'));
    const blob = new Blob(['\uFEFF' + [head.join(';'), ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'polaroids.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  /* ================== NAVEGAÇÃO (#galeria) ================== */
  function route() {
    const gallery = location.hash === '#galeria';
    $('viewStudio').hidden = gallery;
    $('viewGallery').hidden = !gallery;
    $('navStudio').removeAttribute('aria-current');
    $('navGallery').removeAttribute('aria-current');
    $(gallery ? 'navGallery' : 'navStudio').setAttribute('aria-current', 'page');
    if (gallery) openGallery();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
